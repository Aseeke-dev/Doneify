[project]
name = "doneify"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ibrahim Abdulrasheed", email = "iabdulrasheed919@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "psycopg2-binary>=2.9.13",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn>=0.53.0",
]

[project.scripts]
doneify = "doneify:main"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
